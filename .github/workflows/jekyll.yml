name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check site
        run: script/check

      - name: Set up Node for interactive checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser checker
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium

      - name: Check interactive explorer
        run: NODE_PATH="$RUNNER_TEMP/browser-check/node_modules" node script/check-ultrabert-explorer.cjs

      - name: Save interactive previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultrabert-browser-previews
          path: tmp/ultrabert-browser/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
