{% assign post = include.post %}
<li class="post-card"{% if include.filterable %} data-tags="{% for tag in post.tags %}{{ tag }}{% unless forloop.last %},{% endunless %}{% endfor %}"{% endif %}>
  <div class="post-card__meta">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
    {% if post.link %}<span>External article</span>{% endif %}
  </div>
  <h2 class="post-card__title">
    {% if post.link %}
      <a href="{{ post.link }}" target="_blank" rel="noopener">{{ post.title }} <span aria-hidden="true">↗</span><span class="sr-only"> (opens in a new tab)</span></a>
    {% else %}
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    {% endif %}
  </h2>
  <div class="post-card__excerpt">{{ post.excerpt | markdownify }}</div>
</li>
